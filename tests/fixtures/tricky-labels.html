<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tricky labels (fixture)</title>
<style>
  .q { margin: 10px 0; }
</style>
</head>
<body>
<!-- Labels that have caught naive matchers: "place" contains "ctc"-like letters, lakhs vs rupees,
     a skill with no profile number, placeholder-only and aria-labelledby labels, a container with
     two inputs (nearby text must not leak), a role=radiogroup, a display:none checkbox with a
     visible label, and a read-only date picker. -->
<form id="tricky" action="/go" method="post">
  <div class="q"><label for="place">Preferred place of work *</label><input id="place" type="text"></div>
  <div class="q"><label for="exp-ctc">Expected CTC (in lakhs)</label><input id="exp-ctc" type="text" required></div>
  <div class="q"><label for="cur-ctc">Current CTC</label><input id="cur-ctc" type="number" required></div>
  <div class="q">
    <label for="notice">Notice period</label>
    <select id="notice" required>
      <option>Select</option>
      <option>Immediate</option>
      <option>15 days or less</option>
      <option>1 month</option>
      <option>2 months</option>
    </select>
  </div>
  <div class="q">
    <label for="py">How many years of experience do you have with Python? *</label>
    <input id="py" type="number">
  </div>
  <div class="q"><input id="mail" type="email" placeholder="Email address" required></div>
  <div class="q"><span id="li-label">LinkedIn profile</span><div><input id="li" type="url" aria-labelledby="li-label"></div></div>
  <div class="q pair">
    <span>Email</span>
    <input id="gh" type="text" name="github">
    <input id="other" type="text" name="nickname">
  </div>
  <div class="q">
    <div id="auth-q">Are you legally authorized to work in India?</div>
    <div role="radiogroup" aria-labelledby="auth-q">
      <label><input type="radio" name="auth" value="y"> Yes</label>
      <label><input type="radio" name="auth" value="n"> No</label>
    </div>
  </div>
  <div class="q">
    <label for="sponsor">Will you now or in the future require visa sponsorship?</label>
    <select id="sponsor"><option value="">Select an option</option><option>Yes</option><option>No</option></select>
  </div>
  <!-- no placeholder option: the browser shows "Yes", but nobody chose it -->
  <div class="q">
    <label for="sponsor2">Do you need sponsorship to work here?</label>
    <select id="sponsor2"><option>Yes</option><option>No</option></select>
  </div>
  <div class="q">
    <label for="night">Are you okay with night shifts?</label>
    <select id="night"><option>Yes</option><option>No</option></select>
  </div>
  <div class="q"><label for="hear">How did you hear about us?</label><input id="hear" type="text"></div>
  <div class="q">
    <input type="checkbox" id="confirm" style="display:none" required>
    <label for="confirm">I confirm the information above is accurate *</label>
  </div>
  <div class="q"><input id="dob" type="text" readonly required placeholder="Date of birth"></div>
  <div class="q"><button type="submit">Send application</button></div>
</form>
</body>
</html>
